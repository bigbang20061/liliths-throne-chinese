name: Publish Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.4.11.5
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.Substring(1)
            $prerelease = 'false'
          } else {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
            $prerelease = "${{ inputs.prerelease }}"
          }
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match '\s') {
            throw 'The release version must be non-empty and contain no whitespace.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build distribution
        shell: pwsh
        run: mvn --batch-mode clean package

      - name: Bundle Java runtime and package distribution
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $distribution = "target\Lilith's Throne (win)"
          if (-not (Test-Path "$distribution\res")) {
            throw "The build output is missing its res directory."
          }
          $jar = Get-ChildItem -Path $distribution -Filter '*.jar' -File | Select-Object -First 1
          if (-not $jar) {
            throw "The build output is missing its runnable JAR."
          }
          $runtime = Join-Path $distribution 'runtime'
          $modules = (Get-ChildItem "$env:JAVA_HOME\jmods\*.jmod" | ForEach-Object BaseName) -join ','
          & jlink --add-modules $modules --output $runtime --strip-debug --no-header-files --no-man-pages --compress=2
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$runtime\bin\java.exe")) {
            throw "Could not create the bundled Java runtime."
          }
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          for %%F in (*.jar) do set "JAR=%%~fF"
          if not defined JAR (
            echo Game JAR not found.
            pause
            exit /b 1
          )
          "%~dp0runtime\bin\java.exe" -jar "%JAR%"
          '@ | Set-Content -Path (Join-Path $distribution 'Start Liliths Throne.bat') -Encoding ascii
          $archive = "Liliths-Throne-Chinese-$env:VERSION-windows.zip"
          Compress-Archive -Path "$distribution\*" -DestinationPath $archive -CompressionLevel Optimal
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Lilith's Throne Chinese v${{ steps.release.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: ${{ steps.package.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
