name: Feature request
description: Propose an improvement to the game, translation, build, or release process.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述用户可观察到的需求与收益。不要在 Issue 中包含个人信息、存档、Token 或私有链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
        - label: 该建议与本仓库维护范围相关。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前体验的具体限制或痛点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述期望的行为；如有界面、文本或交互变化，请给出示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）

  - type: textarea
    id: context
    attributes:
      label: 补充上下文（可选）
